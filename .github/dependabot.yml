version: 2
updates:
    - package-ecosystem: npm
      directory: '/'
      schedule:
          interval: weekly
      open-pull-requests-limit: 10
      commit-message:
          prefix: chore(deps)
      # Dependency cooldown: let fresh releases soak before PRs are opened
      # (supply-chain worm waves 2025-2026 were typically remediated within days).
      cooldown:
          default-days: 7
          semver-major-days: 14
      groups:
          production-dependencies:
              dependency-type: production
          development-dependencies:
              dependency-type: development
      # ESLint 10 ecosystem: eslint-plugin-jsx-a11y@6.10.2 (latest stable) caps
      # peer at `^9`; eslint-plugin-react@7.37.5 caps at `^9.7`. Both are pulled
      # transitively via eslint-config-next. Bumping eslint to 10.x errors with
      # ERESOLVE. Re-evaluate when those plugins ship ESLint 10 support.
      #
      # @types/node held at ^24.x deliberately per .cursor/brain/DECISIONS.md —
      # alignment with `engines.node >=24` (Node 24 LTS), not Node 26 type defs
      # by default. Re-evaluate when this template's `engines.node` bumps.
      ignore:
          - dependency-name: eslint
            versions: ['>=10']
          - dependency-name: '@eslint/js'
            versions: ['>=10']
          - dependency-name: '@types/node'
            versions: ['>=25']

    - package-ecosystem: github-actions
      directory: '/'
      schedule:
          interval: weekly
      commit-message:
          prefix: ci(deps)
      groups:
          actions:
              patterns: ['*']
