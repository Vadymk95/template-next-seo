name: CI

on:
    pull_request:
        branches: [main, master, develop]
    push:
        branches: [main, master, develop]

jobs:
    validate:
        runs-on: ubuntu-latest

        strategy:
            matrix:
                node-version: [24.x]

        steps:
            - uses: actions/checkout@v4

            - name: Use Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: 'npm'

            # Node 24.15.0 (current LTS) bundles npm 11.12.1, which regressed
            # peerOptional handling (npm/cli#9249, 2026-04-17) — peerOptional deps
            # marked extraneous and removed. Combined with the long-standing
            # cross-platform optional-binaries bug (npm/cli#4828) this means lock
            # files generated on macOS arm64 fail Linux CI with EUSAGE
            # "Missing: <pkg>-linux-x64-gnu from lock file" for native bindings
            # (lightningcss, @parcel/watcher, @rolldown/binding). Both issues are
            # fully restored in npm 11.14.0 (2026-05-06) via arborist 9.5.0. Pin
            # to ^11.14.0 explicitly — npm@latest would track future majors that
            # may regress again.
            - name: Upgrade npm to ^11.14 (cross-platform optional binaries fix)
              run: npm install -g npm@^11.14.0

            - name: Install dependencies
              run: npm ci --ignore-scripts

            # `--audit-level=high` (not moderate): npm audit reports a moderate
            # postcss <8.5.10 advisory transitively via `next 16`, but Next.js
            # patches CSS handling on its own track — `npm audit fix --force`
            # would downgrade next to 9.3.3, which is destructive. We accept the
            # transitive moderate from Next's tree and gate on `high+` advisories
            # the team would actually need to action.
            - name: Audit dependencies
              run: npm audit --audit-level=high

            - name: Run ESLint
              run: npm run lint

            - name: Check Prettier formatting
              run: npm run format:check

            - name: TypeScript check
              run: npm run type-check

            - name: Run tests
              run: npm test

            - name: Cache Next.js build
              uses: actions/cache@v4
              with:
                  path: .next/cache
                  key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**/next.config.*') }}
                  restore-keys: |
                      ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

            - name: Production build
              run: npm run build
              env:
                  ANALYZE: 'false'
                  # Required at build time (env.ts strict in production):
                  # drives metadataBase / sitemap / robots / hreflang. Forks
                  # override per environment in their host. The `.invalid`
                  # TLD is reserved by RFC 6761 — never resolves, never an
                  # accidental real production deploy.
                  NEXT_PUBLIC_APP_URL: https://template-next-seo.invalid

            - name: Install Playwright Chromium
              run: npx playwright install --with-deps chromium

            - name: End-to-end tests
              run: npm run test:e2e
              env:
                  CI: 'true'
                  NEXT_PUBLIC_APP_URL: https://template-next-seo.invalid
