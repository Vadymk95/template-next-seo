name: CI

on:
    pull_request:
        branches: [main, master]
    push:
        branches: [main, master]

permissions:
    contents: read

# Cancel superseded runs on the same branch. Default-branch pushes always finish.
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.ref != 'refs/heads/master' && github.ref != 'refs/heads/main' }}

env:
    # Required at build time (shared/lib/env.ts is strict in production): drives
    # metadataBase / sitemap / robots / hreflang. Forks override per environment in
    # their host. The `.invalid` TLD is reserved by RFC 6761 — it never resolves,
    # so it can never become an accidental real production deploy.
    NEXT_PUBLIC_APP_URL: https://template-next-seo.invalid

jobs:
    validate:
        runs-on: ubuntu-latest
        timeout-minutes: 25

        strategy:
            matrix:
                node-version: [24.x]

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  # Depth 2: the lock-age check compares the lockfile with HEAD~1 and the
                  # test-sibling range check falls back to HEAD~1 as its base in CI; a
                  # private fork's persist-credentials: false means neither can fetch the parent itself.
                  fetch-depth: 2
                  persist-credentials: false

            - name: Use Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: 'npm'

            # `24.x` names no single release: with the default `check-latest: false`
            # setup-node takes the 24.x cached on the runner image, else the newest
            # one from actions/node-versions. On 2026-10-10 that is 24.21.0, which
            # bundles npm 11.19.0 (runner image tool cache and nodejs.org/dist/index.json).
            # The bundled npm depends on the release: 24.15.0 has npm 11.12.1,
            # 24.16.0 and 24.17.0 have 11.13.0, and 24.18.0 (npm 11.16.0) is the
            # first 24.x with npm >= 11.14.0. npm 11.12.1 regressed peerOptional
            # handling (npm/cli#9249, 2026-04-17) — peerOptional deps marked
            # extraneous and removed. Combined with the long-standing
            # cross-platform optional-binaries bug (npm/cli#4828) this means lock
            # files generated on macOS arm64 fail Linux CI with EUSAGE
            # "Missing: <pkg>-linux-x64-gnu from lock file" for native bindings
            # (lightningcss, @parcel/watcher). Both issues are fully restored in
            # npm 11.14.0 (2026-05-06) via arborist 9.5.0. The step is a floor
            # for a runner that resolves `24.x` to an older release; it can be
            # deleted once every setup-node range in this file starts at 24.18.0.
            # Pin to ^11.14.0 explicitly — npm@latest would track future majors
            # that may regress.
            - name: Upgrade npm to ^11.14 (cross-platform optional binaries fix)
              run: npm install -g npm@^11.14.0

            - name: Install dependencies
              run: npm ci --ignore-scripts

            - name: Cache Next.js build
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: .next/cache
                  key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**/next.config.*') }}
                  restore-keys: |
                      ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

            # Keyed on the lock file, so a @playwright/test bump invalidates the
            # cache and scripts/ensure-playwright.mjs (inside the gate) reinstalls
            # the builds that version actually needs.
            - name: Cache Playwright browsers
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ~/.cache/ms-playwright
                  key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

            # ONE step on purpose. `verify:ci` is the chain the pre-push hook runs in
            # phase 1 (`verify:push` dispatches to it), and the `verify` inside it is
            # a strict superset of every check this job used to list separately.
            # Adding a check HERE instead of to the script is what makes a green
            # local gate stop predicting a green CI.
            - name: Verify (the CI gate chain, stages in scripts/gate-tiers.json)
              run: npm run verify:ci
              env:
                  ANALYZE: 'false'

            - name: Upload Playwright report on failure
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              if: failure()
              with:
                  name: playwright-report
                  path: playwright-report/
                  retention-days: 7

    dev-smoke:
        # Its own job, deliberately not part of `verify`. `dev` runs Turbopack while
        # `build` runs webpack with a custom splitChunks hook, so the gate only ever
        # exercises the webpack output — a Turbopack-only crash would ship unseen.
        # A cold Turbopack boot costs 10-30s, a poor trade on every local push, so it
        # runs here in parallel with `validate`: mandatory on every PR, free locally.
        # `npm run verify:full` chains it for the rare local run that needs it.
        name: Turbopack dev smoke
        runs-on: ubuntu-latest
        timeout-minutes: 15

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Use Node.js 24.x
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 24.x
                  cache: 'npm'

            - name: Upgrade npm to ^11.14 (cross-platform optional binaries fix)
              run: npm install -g npm@^11.14.0

            - name: Install dependencies
              run: npm ci --ignore-scripts

            - name: Cache Playwright browsers
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ~/.cache/ms-playwright
                  key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

            - name: Install Playwright browsers if the cache missed
              run: node scripts/ensure-playwright.mjs

            - name: Run Turbopack dev smoke
              run: npm run smoke:dev

    # The tag of the Playwright image the `cross-browser` job runs in: the @playwright/test version the
    # lock file pins, read here so there is one source. A Dependabot or npm update of @playwright/test
    # then moves the image with it; Dependabot does not bump a tag written inside a workflow file.
    # Checks out the lock file only: the job installs nothing and needs no other file.
    playwright-image:
        runs-on: ubuntu-latest
        timeout-minutes: 5
        outputs:
            version: ${{ steps.read.outputs.version }}

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
                  sparse-checkout: package-lock.json
                  sparse-checkout-cone-mode: false

            - name: Read the locked @playwright/test version
              id: read
              run: |
                  version="$(jq -r '.packages["node_modules/@playwright/test"].version' package-lock.json)"
                  [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "package-lock.json has no plain @playwright/test version: ${version}" >&2; exit 1; }
                  echo "version=${version}" >> "$GITHUB_OUTPUT"

    # Firefox and WebKit, on the geometry specs only. They are not in `verify` because three engines on
    # every spec triples the local e2e wall-clock, and a webkit font-metric difference in an unrelated
    # spec would then fail a push for a reason that has nothing to do with the change. Scoped by
    # `testMatch` in `e2e/support/cross-browser.ts`; a typo there collects ZERO tests and reports
    # success, which is why the step below asserts a test actually ran.
    #
    # Runs in the official Playwright image: it ships the three browsers and the system libraries they
    # link against, so the job installs nothing from apt. Installing them on the runner stalled often
    # enough to turn the required check red or slow (measured: DECISIONS.md, "Cross-browser runs in the
    # Playwright image"). `-resolute` is Ubuntu 26.04, the release `ubuntu-latest` had when the job
    # moved, so the per-release Firefox and WebKit builds and the font packages stay the same.
    # `--user 1001` is the runner's uid and Playwright's documented setting for this image, so checkout
    # and setup-node write the workspace as they did before. Node still comes from setup-node: the
    # image's own Node is not the one the repo pins.
    # `!cancelled()`: a job skipped because a job it needs failed reports success, and this is a
    # required check. Running it instead, an empty version fails the container setup, red.
    cross-browser:
        needs: playwright-image
        if: ${{ !cancelled() }}
        runs-on: ubuntu-latest
        timeout-minutes: 10
        container:
            image: mcr.microsoft.com/playwright:v${{ needs.playwright-image.outputs.version }}-resolute
            options: --user 1001
        env:
            HUSKY: '0'
            CROSS_BROWSER: '1'
            PLAYWRIGHT_BROWSERS: 'chromium,firefox,webkit'

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Use Node.js 24.x
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 24.x
                  cache: 'npm'

            - name: Upgrade npm to ^11.14 (cross-platform optional binaries fix)
              run: npm install -g npm@^11.14.0

            - name: Install dependencies
              run: npm ci --ignore-scripts

            # The image already holds this version's builds. This step only proves it: a missing build
            # (an image older than the lock file) fails here, naming the build, instead of in a spec.
            - name: Ensure Playwright browsers (chromium, firefox, webkit)
              run: node scripts/ensure-playwright.mjs

            - name: Build for the production geometry spec
              run: npm run build

            # `--list` first, so a `testMatch` that selects nothing fails HERE with a readable message
            # instead of passing silently as an empty run.
            - name: Assert every engine has tests to run
              run: node scripts/check-cross-browser-selection.mjs

            - name: Layout geometry on every engine (production routes)
              run: npm run test:e2e:prod

            - name: Content stress on every engine (dev server)
              run: npm run smoke:dev

            - name: Upload Playwright report on failure
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              if: failure()
              with:
                  name: playwright-report-cross-browser
                  path: playwright-report/
                  retention-days: 7
